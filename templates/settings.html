<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — Jellyfin Flag Setter</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="nav-bar">
    <a href="/" class="nav-brand">Jellyfin Flag Setter</a>
    <div class="nav-actions">
      <span class="nav-user">{{ user.username }}</span>
      <a href="/settings" class="btn btn-secondary btn-sm">Settings</a>
      <a href="/logout" class="btn btn-secondary btn-sm">Logout</a>
    </div>
  </nav>

  <h1>Settings</h1>

  <h2>Change Password</h2>
  {% if error %}
  <div class="form-error">{{ error }}</div>
  {% endif %}
  {% if success %}
  <div class="form-success">{{ success }}</div>
  {% endif %}
  <form method="post" action="/settings/password" class="settings-form">
    <div class="form-group">
      <label for="current_password">Current Password</label>
      <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
    </div>
    <div class="form-group">
      <label for="new_password">New Password</label>
      <input id="new_password" name="new_password" type="password" autocomplete="new-password" required>
    </div>
    <div class="form-group">
      <label for="new_password_confirm">Confirm New Password</label>
      <input id="new_password_confirm" name="new_password_confirm" type="password" autocomplete="new-password" required>
    </div>
    <div class="apply-bar">
      <button type="submit">Update password</button>
      <a href="/" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</body>
</html>
