<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup — Jellyfin Flag Setter</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Connect to Jellyfin</h1>
      <p class="auth-hint">Enter your Jellyfin server URL and an API key to get started.</p>
      {% if error %}
      <div class="form-error">{{ error }}</div>
      {% endif %}
      <div id="syncing-msg" hidden>
        <p class="auth-hint" style="margin-top: 0.5rem;">
          Connected! Syncing your library — this may take a moment&hellip;
        </p>
      </div>
      <form id="setup-form" method="post" action="/setup/jellyfin">
        <div class="form-group">
          <label for="jellyfin_url">Server URL</label>
          <input id="jellyfin_url" name="jellyfin_url" type="url" placeholder="http://192.168.1.100:8096" autofocus required>
        </div>
        <div class="form-group">
          <label for="jellyfin_api_key">API Key</label>
          <input id="jellyfin_api_key" name="jellyfin_api_key" type="text" placeholder="Your Jellyfin API key" required>
        </div>
        <button id="submit-btn" type="submit" class="form-submit">Connect</button>
      </form>
      <p class="auth-hint" style="margin-top: 1rem; font-size: 0.8em;">
        Generate an API key in Jellyfin under Dashboard → API Keys.
      </p>
    </div>
  </div>
  <script>
    document.getElementById('setup-form').addEventListener('submit', function () {
      document.getElementById('submit-btn').disabled = true;
      document.getElementById('submit-btn').textContent = 'Connecting…';
      document.getElementById('syncing-msg').hidden = true;

      setTimeout(function () {
        document.getElementById('syncing-msg').hidden = false;
        document.getElementById('submit-btn').textContent = 'Syncing…';
      }, 1500);
    });
  </script>
</body>
</html>
