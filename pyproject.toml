[project]
name = "jellyfin-flag-setter"
version = "2026.5.2"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.135.3",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "bcrypt>=4.0.0",
    "pydantic-settings>=2.13.1",
    "python-multipart>=0.0.26",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.44.0",
    "wand>=0.7.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.5.0",
    "pre-commit>=4.5.1",
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "respx>=0.22",
    "ruff>=0.15.10",
    "ty>=0.0.31",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
jellyfin-flag-setter = "jellyfin_flag_setter.main:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
